<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/Rueda-libre/estilos.css/estilo.css">
    <title>Reserva tu bicicleta</title>
</head>

<body>
    <img src="img/IMG/Minimalist Green Eco Bicycle Logo.png" alt="logo" width="300">
    <nav>
        <ul>
            <h2>Menú principal</h2>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="tarifas.html">Tarifas y rutas</a></li>
            <li><a href="reservas.html">Reservas</a></li>
        </ul>
    </nav>
    <section id="Formulario de reserva">

        <h2>Tus datos</h2>
        <form action="/reservas" method="POST">

            <!-- Campo de Texto para el Nombre documento correo y telefono -->
            <div class="form-group">
                <label for="text">Nombre: </label>
                <input type="text" id="nombre" name="nombre" minlength="3" required
                    placeholder="Ingresar min 3 caracteres">
            </div>

            <div class="form-group">
                <label for="text">Numero de documento:</label>
                <input type="text" id="Numero de documento" name="Numero de documento" minlength="6" maxlength="10"
                    placeholder="Entre 6 a 10 digitos">
            </div>

            <div class="form-group">
                <label for="text">Telefono:</label>
                <input type="tel" id="celular" name="celular" required minlength="10" maxlength="10"
                    pattern="3[0-9]{9}">
            </div>

            <div class="form-group">
                <label for="text">Correo:</label>
                <input type="email" id="Correo" name="Correo" placeholder="ejemplo@correo.com" required>
            </div>
    </section>
    <section id="formulario de alquiler ">
        <h2>Tu alquiler</h2>
        <!-- Contenedor para la Fecha de Entrada -->
        <div class="form-group">
            <label for="fecha-llegada">Fecha del alquiler</label>
            <input type="date" id="Fecha" name="fecha" required min="2026-11-01" max="2026-12-31">
        </div>

        <div class="form-group">
            <label for=" Tipo-de-bicicleta">Tipo de bicicleta:</label>
            <select name="Tipo_de_bicicleta" id="Tipo-de-bicicleta" required>
                <option value="" disabled selected> Selecciona una opcion...</option>
                <!-- Opciones del menú desplegable -->
                <option value="Urbana"> Urbana </option>
                <option value="Montaña"> Montaña </option>
                <option value="Electrica"> Electrica </option>
            </select>
        </div>

        <div class="form-group">
            <label for="Plan">plan:</label>
            <select name="Plan" id="plan" required>
                <option value="" disabled selected> Selecciona una opcion...</option>
                <option value="1 hora"> 1 hora</option>
                <option value="Medio dia"> Medio día</option>
                <option value="Día completo"> Día completo</option>
            </select>
        </div>

        <div class="Cantidad de bicicletas">
            <label for="Texto"> Cantidad de bicicletas:</label>
            <input type="text" id="Cantidad_de_bicicletas" name="Cantidad_de_bicicletas" required min="1" max="6">
        </div>

        <div class="form-group">
            <label for="Recorrido">Recorrido:</label>
            <select name="Recorrido" id="recorrido" required>
                <option value="" disabled selected> Selecciona una opcion...</option>
                <option value="Rio parques">Rio parques</option>
                <option value="Sabores de Barrio">Sabores de Barrio</option>
                <option value="Reto las palmas">Reto las palmas</option>
                <option value="Ninguno">Ninguno</option>
            </select>
        </div>
    </section>

    <section id="Adicional">
        <h2>Informacion Adicional</h2>
        <div class="form-group">
            <label for="comentarios">comentarios</label>
            <input type="text" id="comentarios" name="comentarios" maxlength="300">
        </div>
        <label for="Terminos&condiciones">Terminos & condiciones</label>
        <input type="checkbox" name="Terminos_condiciones" id="Terminos_condiciones" required>
    </section>
    <button type="submit">Reservar</button>
</body>
<footer>
    <address class="contacto-footer">
        <h4>Contacto</h4>
        <p>📧 Correo: <a href="mailto:soporte@tuweb.com">soporte@tuweb.com</a></p>
        <p>📞 Teléfono: <a href="tel:+123456789">+1 234 567 89</a></p>
        <p>📍 Medellín, Colombia</p>
    </address>

    <div class="copyright">
        <p>&copy; 2026 Tu bicileta. Todos los derechos reservados.</p>
    </div>
</footer>

</html>
